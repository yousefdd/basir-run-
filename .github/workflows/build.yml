name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # EfficientDet-Lite0 from the MediaPipe model catalogue (Apache 2.0). If the download fails the
      # app still builds, reports obstacle detection as unavailable and refuses guided runs.
      - name: Download obstacle model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/efficientdet_lite0.tflite \
            https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite \
            || echo "::warning::Obstacle model download failed"
          ls -l app/src/main/assets || true

      # D-FINE-N (Apache 2.0): official COCO weights from the D-FINE releases, exported to ONNX here
      # and checked against PyTorch (tools/models/export_dfine.py). Cached, so it runs once.
      - name: Cache object model
        id: dfine-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/dfine_n_coco.onnx
          key: dfine-n-coco-956d170-${{ hashFiles('tools/models/export_dfine.py') }}

      - name: Export object model
        if: steps.dfine-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/Peterande/D-FINE /tmp/D-FINE
          git -C /tmp/D-FINE checkout -q 956d1709314c2c6a4df6f34de232054578a7449f
          curl -fL --retry 3 -o /tmp/dfine_n_coco.pth https://github.com/Peterande/storage/releases/download/dfinev1.0/dfine_n_coco.pth
          echo "41973938d2784d38a9836990d805b8392855ebf611aba55f0f7add90e110744c  /tmp/dfine_n_coco.pth" | sha256sum -c -
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet PyYAML onnx onnxruntime scipy faster-coco-eval calflops transformers loguru tensorboard
          python tools/models/export_dfine.py /tmp/D-FINE /tmp/dfine_n_coco.pth app/src/main/assets/dfine_n_coco.onnx 2>&1 | tail -5 \
            | while IFS= read -r line; do echo "$line"; echo "::notice title=dfine-export::$line"; done
          test -s app/src/main/assets/dfine_n_coco.onnx

      # Depth Anything V2 Small (Apache 2.0), int8, dynamic input size, from HuggingFace; if that
      # fails, the same weights from the GitHub mirror the blind-navigation tool uses (fixed 518×518,
      # checked against its SHA-256). Without either the app refuses guided runs.
      - name: Download depth model
        run: |
          curl -fL --retry 3 -o app/src/main/assets/depth_anything_v2_small.onnx \
            https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_quantized.onnx \
          || { curl -fL --retry 3 -o app/src/main/assets/depth_anything_v2_small.onnx \
                 https://github.com/fabio-sim/Depth-Anything-ONNX/releases/download/v2.0.0/depth_anything_v2_vits.onnx \
               && echo "d2b11a11c1d4a12b47608fa65a17ee9a4c605b55ee1730c8e3b526304f2562be  app/src/main/assets/depth_anything_v2_small.onnx" | sha256sum -c - \
               && echo "::warning::Depth model taken from the GitHub mirror (518×518, slower)"; } \
          || { rm -f app/src/main/assets/depth_anything_v2_small.onnx; echo "::warning::Depth model download failed"; }
          ls -l app/src/main/assets

      # Compile errors and failed tests are also raised as annotations, readable through the API.
      - name: Test and build debug APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |FAILED|AssertionError|Exception:" build.log | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit 1
          }

      # Test counts in the job summary and the raw reports as an artifact, pass or fail.
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, sys, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          lines = []
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); failed += int(r.get("failures", 0)) + int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
              line = f"{r.get('name').split('.')[-1]}: {r.get('tests')} tests, {int(r.get('failures', 0)) + int(r.get('errors', 0))} failed, {r.get('skipped')} skipped"
              print(f"- {line}")
              lines.append(line)
          print(f"**Unit tests: {total} run, {failed} failed, {skipped} skipped**")
          # One annotation only: GitHub shows at most ten per step.
          print(f"::notice title=tests::TOTAL {total} run, {failed} failed, {skipped} skipped | " + " | ".join(sorted(lines)), file=sys.stderr)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/

      - uses: actions/upload-artifact@v4
        with:
          name: basir-run-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Replaces the "latest" release so the newest APK is always at the same link.
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk basir-run.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest basir-run.apk --prerelease \
            --title "أحدث نسخة تجريبية" \
            --notes "تُبنى تلقائياً من آخر تعديل على الفرع main."
