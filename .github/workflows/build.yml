name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # EfficientDet-Lite0 from the MediaPipe model catalogue (Apache 2.0). If the download fails the
      # app still builds, reports obstacle detection as unavailable and refuses guided runs.
      - name: Download obstacle model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/efficientdet_lite0.tflite \
            https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite \
            || echo "::warning::Obstacle model download failed"
          ls -l app/src/main/assets || true

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      # Test counts in the job summary and the raw reports as an artifact, pass or fail.
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); failed += int(r.get("failures", 0)) + int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
              print(f"- {r.get('name').split('.')[-1]}: {r.get('tests')} tests, {int(r.get('failures', 0)) + int(r.get('errors', 0))} failed, {r.get('skipped')} skipped")
          print(f"**Unit tests: {total} run, {failed} failed, {skipped} skipped**")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/

      - uses: actions/upload-artifact@v4
        with:
          name: basir-run-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Replaces the "latest" release so the newest APK is always at the same link.
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk basir-run.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest basir-run.apk --prerelease \
            --title "أحدث نسخة تجريبية" \
            --notes "تُبنى تلقائياً من آخر تعديل على الفرع main."
